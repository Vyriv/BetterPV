name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish ${{ matrix.minecraft }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - "26.1.2"
          - "26.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.minecraft }}:build --no-daemon

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          PROPS="versions/${{ matrix.minecraft }}/gradle.properties"

          MOD_VERSION=$(grep '^mod_version=' "$PROPS" | cut -d= -f2-)
          JAR="versions/${{ matrix.minecraft }}/build/libs/BetterPV-${MOD_VERSION}.jar"

          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

          echo "Publishing $MOD_VERSION"
          echo "Jar: $JAR"

          test -f "$JAR"

      - name: Publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_PROJECT_ID }}

          name: BetterPV ${{ steps.meta.outputs.mod_version }}
          version: ${{ steps.meta.outputs.mod_version }}

          channel: release
          loaders: fabric
          game-versions: ${{ matrix.minecraft }}
          environment: client_only

          files: ${{ steps.meta.outputs.jar }}

          changelog: |
            See the BetterPV GitHub release/changelog for this version.