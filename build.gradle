plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

configurations {
	sparkRuntime
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Spark profiler for the Loom run folder — https://spark.lucko.me/
	sparkRuntime "maven.modrinth:spark:${project.spark_version}"
}

tasks.register("prepareSpark", Copy) {
	from configurations.sparkRuntime
	into layout.projectDirectory.dir("run/mods")
	rename { String fileName -> "spark.jar" }
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

afterEvaluate {
	tasks.matching { it.name == "runClient" || it.name == "runServer" }.configureEach {
		dependsOn("prepareSpark")
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
