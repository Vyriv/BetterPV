plugins {
	id 'net.fabricmc.fabric-loom'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = rootProject.property('archives_base_name')
}

repositories {
	mavenCentral()
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

configurations {
	sparkRuntime
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Spark profiler for the Loom run folder - https://spark.lucko.me/
	sparkRuntime "maven.modrinth:spark:${rootProject.property('spark_version')}"
}

tasks.register("prepareSpark", Copy) {
	from configurations.sparkRuntime
	into layout.projectDirectory.dir("run/mods")
	rename { String fileName -> "spark.jar" }
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

afterEvaluate {
	tasks.matching { it.name == "runClient" || it.name == "runServer" }.configureEach {
		dependsOn("prepareSpark")
	}
}

/** Worker Hypixel auth secret: env {@code VYPV_HYPIXEL_SECRET} or gitignored {@code betterpv.local.properties}. */
def resolveWorkerHypixelSecret = {
	def fromEnv = System.getenv("VYPV_HYPIXEL_SECRET")
	if (fromEnv != null && !fromEnv.isBlank()) {
		return fromEnv.trim()
	}
	def local = rootProject.file("betterpv.local.properties")
	if (local.exists()) {
		def props = new Properties()
		local.withInputStream { props.load(it) }
		def value = props.getProperty("betterpv.hypixel.worker.secret", "")
		if (value != null && !value.isBlank() && value != "REPLACE_ME") {
			return value.trim()
		}
	}
	return ""
}

def workerHypixelSecret = resolveWorkerHypixelSecret()
def generatedSecretsDir = layout.buildDirectory.dir("generated/sources/betterpvSecrets")

tasks.register("generateWorkerSecrets") {
	inputs.property("workerHypixelSecret", workerHypixelSecret)
	outputs.dir(generatedSecretsDir)
	doLast {
		def pkgDir = new File(generatedSecretsDir.get().asFile, "dev/vy/betterpv/client/api")
		pkgDir.mkdirs()
		def escaped = workerHypixelSecret
			.replace("\\", "\\\\")
			.replace("\"", "\\\"")
			.replace("\r", "")
			.replace("\n", "")
		new File(pkgDir, "WorkerSecrets.java").text = """\
package dev.vy.betterpv.client.api;

/** Generated at build time from betterpv.local.properties / VYPV_HYPIXEL_SECRET. Do not edit. */
public final class WorkerSecrets {
	private WorkerSecrets() {
	}

	public static final String HYPIXEL_WORKER_SECRET = "${escaped}";
}
"""
		if (workerHypixelSecret.isBlank()) {
			logger.warn("BetterPV: no hypixel worker secret - set VYPV_HYPIXEL_SECRET or betterpv.local.properties (see betterpv.local.properties.example)")
		}
	}
}

sourceSets {
	main {
		java {
			srcDir(generatedSecretsDir)
		}
	}
}

tasks.named("compileJava").configure {
	dependsOn("generateWorkerSecrets")
}

def javaVersionNumber = (project.property("java_version") as String).toInteger()

processResources {
	def props = [
		version  : project.version,
		loader   : project.property("loader_dependency"),
		minecraft: project.property("minecraft_dependency"),
		java     : project.property("java_dependency")
	]
	inputs.properties(props)

	filesMatching("fabric.mod.json") {
		expand(props)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersionNumber
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersionNumber)
	}

	def javaVersion = JavaVersion.toVersion(javaVersionNumber)
	sourceCompatibility = javaVersion
	targetCompatibility = javaVersion
}

tasks.named("sourcesJar", Jar).configure {
	dependsOn("generateWorkerSecrets")
	exclude("**/WorkerSecrets.java")
}

tasks.register("buildAndCollect", Copy) {
	group = "build"
	description = "Builds this version and copies jars to dist."
	dependsOn("build")
	from(tasks.named("jar"), tasks.named("sourcesJar"))
	into(rootProject.layout.projectDirectory.dir("dist"))
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
