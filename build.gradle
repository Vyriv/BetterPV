plugins {
	id 'net.fabricmc.fabric-loom'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = rootProject.property('archives_base_name')
}

repositories {
	mavenCentral()
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

configurations {
	sparkRuntime
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Spark profiler for the Loom run folder - https://spark.lucko.me/
	sparkRuntime "maven.modrinth:spark:${rootProject.property('spark_version')}"
}

tasks.register("prepareSpark", Copy) {
	from configurations.sparkRuntime
	into layout.projectDirectory.dir("run/mods")
	rename { String fileName -> "spark.jar" }
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

afterEvaluate {
	tasks.matching { it.name == "runClient" || it.name == "runServer" }.configureEach {
		dependsOn("prepareSpark")
	}
}

def javaVersionNumber = (project.property("java_version") as String).toInteger()

processResources {
	def props = [
		version  : project.version,
		loader   : project.property("loader_dependency"),
		minecraft: project.property("minecraft_dependency"),
		java     : project.property("java_dependency")
	]
	inputs.properties(props)

	filesMatching("fabric.mod.json") {
		expand(props)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersionNumber
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersionNumber)
	}

	def javaVersion = JavaVersion.toVersion(javaVersionNumber)
	sourceCompatibility = javaVersion
	targetCompatibility = javaVersion
}

tasks.register("buildAndCollect", Copy) {
	group = "build"
	description = "Builds this version and copies jars to dist."
	dependsOn("build")
	from(tasks.named("jar"), tasks.named("sourcesJar"))
	into(rootProject.layout.projectDirectory.dir("dist"))
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
